name: Security Scan

# Reporting-only security telemetry pipeline: Semgrep + Trivy (static) and
# Nuclei (dynamic, against a RailsGoat instance built and booted from this
# checkout via docker-compose), followed by a Gemini-generated, CWE-aware,
# risk-prioritized PR comment via jeffdecastro/security-pipeline-shared.
# This workflow must never modify repository files, and must never fail
# the build based on findings — see continue-on-error below on every
# build/boot/scan/report step.

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: >
          PR number to post the Gemini report comment to (for manually
          testing gemini-report without relying on a live pull_request
          event, e.g. against this fork's own PRs)
        required: true
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  static-analysis:
    name: Static Analysis (Semgrep + Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Semgrep (Ruby/Rails rulesets)
        continue-on-error: true
        run: |
          docker run --rm \
            --platform linux/amd64 \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942 \
            semgrep scan \
              --config=p/ruby \
              --config=p/security-audit \
              --config=p/owasp-top-ten \
              --config=p/cwe-top-25 \
              --sarif \
              --output=semgrep.sarif \
              --no-git-ignore \
              .

      - name: Run Trivy filesystem scan (Gemfile.lock + source)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'

      - name: Upload Semgrep SARIF to code scanning
        uses: github/codeql-action/upload-sarif@08d09a53f0f5d694f253bd25732e4429c9e9337f # v3.37.2
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Trivy SARIF to code scanning
        uses: github/codeql-action/upload-sarif@08d09a53f0f5d694f253bd25732e4429c9e9337f # v3.37.2
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Upload Semgrep SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-output
          path: semgrep.sarif
          if-no-files-found: warn

      - name: Upload Trivy SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-output
          path: trivy.sarif
          if-no-files-found: warn

  dynamic-scan:
    name: Dynamic Scan (Nuclei against live RailsGoat)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build RailsGoat image
        continue-on-error: true
        run: docker compose build web

      - name: Initialize database (sqlite) and boot RailsGoat
        continue-on-error: true
        run: |
          docker compose run --rm web bundle exec rake db:create db:migrate db:seed
          docker compose up -d web
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000/ && break
            sleep 5
          done

      - name: Run Nuclei against local RailsGoat instance
        continue-on-error: true
        run: |
          mkdir -p nuclei-results
          docker run --rm --network host \
            --platform linux/amd64 \
            -v "${{ github.workspace }}/nuclei-results:/output" \
            projectdiscovery/nuclei@sha256:8b82dfd56c02cbc47a6d328c58ff3292bfdb633e964f0f119b6d41d3a5ee33ef \
            -target http://localhost:3000 \
            -jsonl \
            -output /output/nuclei-results.json

      - name: Dump RailsGoat container logs on failure
        if: failure()
        continue-on-error: true
        run: docker compose logs web || true

      - name: Stop RailsGoat containers
        if: always()
        continue-on-error: true
        run: docker compose down -v || true

      - name: Upload Nuclei results artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nuclei-results
          path: nuclei-results/nuclei-results.json
          if-no-files-found: warn

  gemini-report:
    name: Gemini Report (dev-readable, risk-prioritized)
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    needs: [static-analysis, dynamic-scan]
    uses: jeffdecastro/security-pipeline-shared/.github/workflows/gemini-report.yml@ae4c89df26ae58928a4b456f6e019d1a1daaa200 # main @ 2026-07-22
    permissions:
      contents: read
      pull-requests: write
    with:
      pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
      artifact_manifest: "semgrep-sarif=semgrep-output,trivy-sarif=trivy-output,nuclei-jsonl=nuclei-results"
      shared_ref: ae4c89df26ae58928a4b456f6e019d1a1daaa200
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
